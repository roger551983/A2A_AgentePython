services:
  agente-a2a:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agente-a2a
    env_file:
      - variables_entorno.env
    ports:
      - "8001:8001"
    command:
      - python
      - -m
      - uvicorn
      - agente_ejecutor:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    restart: unless-stopped